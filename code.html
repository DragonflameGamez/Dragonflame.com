<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./Profile.jpg" type="image/jpeg">
</head>
<body>
  <h2>HTML Example containing enough basic HTML to create a website of your own</h2>
  <textarea rows="50" cols="100" readonly>
        <!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="styles.css">
            <title>My Website</title>
          </head>
          <body>
            <main>
              <nav id="navbar">
                <ul>
                  <li><a href="#home">Home</a></li>
                  <li><a href="#about">About</a></li>
                  <li><a href="#contact">Contact</a></li>
                </ul>
              </nav>
              <section id="home">
                <h1>This is a header one element only put one on each page</h1>
                <h2>Header 2</h2>
                <h3>Header 3</h3>
                <h4>Header 4</h4>
                <h5>Header 5</h5>
                <h6>Header 6 ensure header elements are in order and not used out of sequence</h6>
              </section>
              <section id="about">
                <h2>About</h2>
                <p>This is a paragraph, or p, element. It contains text content. It is used to structure and present information on the webpage.</p>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
                <!-- This is a comment in HTML, they are not displayed on the webpage we can use a comment to leave notes for ourselves or other developers  for example "Replace Lorem Ipsum with actual about"-->
                <!-- Lorem Ipsum is a placeholder text commonly used in the design and layout of webpages and it has an interesting history that I will go over on my website -->
              </section>
              <section id="contact">
                <address>
                  123 Main St, Anytown, USA<br>
                  Phone: (123) 456-7890<br>
                  Email: contact@example.com
                </address>
              </section>
              <div id="generic information">
                <p>A div element is used to create a generic container for grouping and styling content on the webpage. It is important that you do not use it for semantic purposes, such as representing a section or article, but rather for layout and styling.</p>
                <p>an example of proper use of a div would be to create a box on your website to be styled later with CSS.</p>
                <p>An example of bad div use would be for a contact section which you should use a <code>section</code> element instead. I also prefer to put an <code>address</code> element for the contact details</p>
              </div>
              <a href="https://example.com">This is a link</a>
            </main>
            <footer>
              <p>&copy; 2024 My Website. All rights reserved.</p>
            </footer>
          </body>
        </html>
    </textarea>
  <footer>
    <p>If you'd like to learn web development, check out <a href="https://freecodecamp.org">FreeCodeCamp</a></p>
    <p class="note">Note: I do not own or have any relation to freecodecamp it is just how I learned to code myself</p>
  </footer>
</body>
</html>
